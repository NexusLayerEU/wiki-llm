[project]
name = "wikiforge"
version = "0.1.0"
description = "AI-powered document-to-wiki engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "PyMuPDF>=1.24.0",
  "httpx>=0.27.0",
  "markdown>=3.6",
  "Pygments>=2.18.0",
  "pyyaml>=6.0",
  "jinja2>=3.1.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5.0"]

[project.scripts]
wikiforge = "wikiforge.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wikiforge*"]

[tool.setuptools.package-data]
wikiforge = ["prompts/*.j2", "static/**/*"]
